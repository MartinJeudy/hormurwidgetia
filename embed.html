<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://hormur.com/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light">
    <title>Hormur Widget Embed</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html {
        background: rgba(0,0,0,0);
        background-color: rgba(0,0,0,0);
        color-scheme: light;
        /* Fix hauteur pour tous les navigateurs mobiles */
        height: 100vh;
        height: 100dvh;
      }
      body {
        background: rgba(0,0,0,0);
        background-color: rgba(0,0,0,0);
        height: 100%;
      }
      #root {
        background: rgba(0,0,0,0);
        background-color: rgba(0,0,0,0);
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/embed-main.jsx"></script>
  </body>
</html>
